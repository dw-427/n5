<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 장벽을 달리는 8개의 레일</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#e9eef3;font:14px/1.5 system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:24px;left:30px;right:30px;pointer-events:none}h1{font-size:24px;font-weight:500;margin:0;letter-spacing:-.04em}#stage{font-size:18px;margin-top:7px}small{font-size:11px;color:#a5b7c8}.controls{position:absolute;bottom:24px;left:30px;right:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:3}button,select{font:inherit;color:#edf2f7;background:#1c2b39;border:1px solid #536473;padding:8px 12px;cursor:pointer}input{accent-color:#d7e7f4;flex:1;min-width:120px}#legend{position:absolute;top:125px;right:25px;width:260px;background:#101923e8;padding:12px}#legend button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 2px;border:0;background:transparent;font-size:12px;text-align:left}.dot{width:18px;height:3px;display:inline-block;flex-shrink:0}.name{flex:1}.value{font-variant-numeric:tabular-nums}#note{position:absolute;bottom:91px;left:30px;max-width:540px;color:#9badbd;font-size:11px;pointer-events:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f6e8a2;outline-offset:3px}@media(max-width:640px){header{left:16px;top:16px}h1{font-size:19px}#stage{font-size:15px}#legend{top:105px;right:12px;width:210px;padding:8px}#legend button{font-size:10px;padding:4px 0}.controls{left:16px;right:16px;bottom:16px;gap:6px}.controls button,.controls select{font-size:12px;padding:7px}#note{left:16px;right:16px;bottom:116px;font-size:10px}}

</style><canvas id="view" role="img" aria-label="8개 업종의 9개 장애 요인 응답률을 각기 다른 색상의 레일 높이로 표현한 전진형 시각화. 현재 항목의 정확한 수치는 오른쪽 목록에서 확인할 수 있습니다."></canvas><header><h1>AI 장벽을 달리는 8개의 레일</h1><div id="stage" aria-live="polite"></div><small>높이 = 응답률(%) · 레일 한 개 = 업종 한 개</small></header><div id="legend" aria-label="업종별 현재 구간 응답률"></div><div id="note">구간 순서는 원자료 항목 순서를 따른 탐색 순서입니다. 시간 변화나 인과관계가 아닙니다.<br>구간 사이 곡선은 시각적 연결이며 관측값이 아닙니다. 2024 디자인산업통계 · 중복응답.</div><div class="controls"><button id="play">출발</button><button id="previous" aria-label="이전 장애 요인">←</button><select id="jump" aria-label="장애 요인 구간"></select><button id="next" aria-label="다음 장애 요인">→</button><input id="progress" type="range" min="0" max="8" step="0.001" value="0" aria-label="레일 이동 위치"><span id="count">1 / 9</span></div><script>
const data=[{"name": "제품디자인", "values": [19647.0, 19.6, 2.3, 24.4, 21.9, 43.7, 18.4, 7.2, 19.3, 2.7, 0.9, 4.5, 19647.0, 15.3, 2.3, 12.6, 9.3, 39.6, 6.4, 1.5, 9.5, 0.2, 0.6, 2.7]}, {"name": "시각디자인", "values": [12035.0, 36.2, 25.1, 8.5, 7.4, 25.3, 6.7, 2.7, 26.6, 2.6, 0.5, 2.3, 12035.0, 27.4, 25.1, 4.5, 2.8, 24.5, 4.2, 2.1, 6.8, 0.6, 0.5, 1.4]}, {"name": "디지털/멀티미디어디자인", "values": [5618.0, 36.9, 24.2, 5.9, 4.9, 21.0, 5.8, 8.6, 23.3, 11.5, 0.0, 2.6, 5618.0, 31.9, 24.2, 4.1, 4.9, 17.1, 1.5, 3.1, 6.5, 4.1, 0.0, 2.6]}, {"name": "인테리어디자인", "values": [25781.0, 25.0, 16.2, 12.2, 9.1, 46.6, 7.3, 1.1, 10.2, 3.9, 0.5, 4.0, 25781.0, 20.9, 16.2, 4.0, 5.7, 42.9, 4.2, 0.6, 2.4, 0.9, 0.5, 1.7]}, {"name": "패션/텍스타일디자인", "values": [5563.0, 25.8, 8.1, 16.1, 15.8, 34.8, 16.8, 8.2, 12.6, 2.9, 1.3, 0.8, 5563.0, 22.3, 8.1, 5.8, 15.7, 34.8, 5.2, 5.8, 1.4, 0.5, 0.0, 0.5]}, {"name": "서비스/경험디자인", "values": [35538.0, 29.6, 6.6, 36.8, 13.9, 21.0, 20.8, 20.5, 7.9, 3.0, 0.0, 2.7, 35538.0, 22.4, 6.6, 17.2, 10.2, 18.7, 7.6, 11.8, 3.6, 1.4, 0.0, 0.6]}, {"name": "공예디자인", "values": [4728.0, 46.5, 1.7, 30.9, 12.7, 23.3, 8.0, 4.2, 30.6, 6.4, 0.0, 5.7, 4728.0, 38.9, 1.7, 8.7, 7.1, 22.6, 2.1, 1.4, 12.6, 0.0, 0.0, 4.9]}, {"name": "디자인인프라", "values": [43348.0, 22.7, 23.4, 12.2, 9.0, 43.3, 2.8, 5.4, 10.3, 4.5, 0.3, 4.1, 43348.0, 18.7, 23.4, 4.9, 5.2, 38.9, 0.9, 1.4, 2.8, 2.9, 0.3, 0.7]}],labels=['구독 비용 부담','인프라·인력 부재','사용 방법의 어려움','이용 필요성 부재','호환성 문제','교육 프로그램 부재','보안 문제','저작권 등 법적 문제','경영진의 반대'],cols=[1,3,4,5,6,7,8,9,10],colors=['#ff907d','#ffcf67','#c8e779','#66d5b5','#76c5ff','#a5a0ff','#ee9cdc','#e8ded0'];
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,pos=0,targetPos=0,playing=false,focus=-1,last=performance.now(),previousStage=-1;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
labels.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+l;$('jump').append(o)});
const buttons=data.map((d,i)=>{let b=document.createElement('button');b.setAttribute('aria-pressed','false');b.innerHTML='<span class="dot" style="background:'+colors[i]+'"></span><span class="name">'+(i+1)+'. '+d.name+'</span><span class="value"></span>';b.onclick=()=>{focus=focus===i?-1:i;buttons.forEach((e,j)=>e.setAttribute('aria-pressed',String(j===focus)));wake()};$('legend').append(b);return b});
function sample(i,t){t=Math.max(0,Math.min(8,t));let a=Math.floor(t),b=Math.min(8,a+1),u=t-a;u=u*u*(3-2*u);return data[i].values[cols[a]]*(1-u)+data[i].values[cols[b]]*u}
function project(x,y,z){const depth=z-pos*360+280,f=560/depth;return{x:W*.46+x*f*Math.min(1,W/1100),y:H*.40+(104-y)*f*Math.min(1,H/800),s:f,depth}}
function line(points,color,width=1,alpha=1){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore()}
function depthStyle(distance){const d=Math.max(0,distance);return {alpha:Math.exp(-d*1.5),blur:Math.min(9,Math.max(0,d-.38)*4.2)}}
let animationFrame=0,dirty=true;
function wake(){dirty=true;if(!animationFrame&&!document.hidden){last=performance.now();animationFrame=requestAnimationFrame(tick)}}
function draw(){ctx.clearRect(0,0,W,H);
const stage=Math.min(8,Math.round(pos));
// Only one observation plane is annotated. Later gates are intentionally unlabelled.
for(let gate=Math.min(8,Math.ceil(pos+2.5));gate>=Math.max(0,Math.ceil(pos-.3));gate--){let dist=gate-pos,style=depthStyle(dist);ctx.save();let a=project(-230,0,gate*360),b=project(230,0,gate*360);line([a,b],'#94abc4',1,style.alpha*.22);ctx.restore();}
for(let h=0;h<=50;h+=10){let p=project(-240,h*3,stage*360),q=project(230,h*3,stage*360);line([p,q],'#8ca0b8',1,.07);ctx.fillStyle='#8b9eb5';ctx.font='11px system-ui';ctx.textAlign='right';ctx.fillText(h+'%',p.x-9,p.y+4)}
// Render farther segments first, using depth-specific blur; no blur touches real-value labels.
for(let segment=Math.min(7,Math.floor(pos+2));segment>=Math.max(0,Math.floor(pos-.25));segment--){for(let i=0;i<8;i++){let x=(i-3.5)*57,alpha=focus<0||focus===i?1:.12;for(let part=1;part>=0;part--){let from=Math.max(segment+part*.5,pos-.25,0),to=Math.min(segment+(part+1)*.5,8);if(to<=from)continue;let style=depthStyle((from+to)/2-pos),points=[];for(let k=0;k<=8;k++){let t=to+(from-to)*k/8;points.push(project(x,sample(i,t)*3,t*360))}ctx.save();line(points,colors[i],focus===i?4.5:2.5,alpha*style.alpha);ctx.restore();}}}
for(let i=0;i<8;i++){let x=(i-3.5)*57,p=project(x,data[i].values[cols[stage]]*3,stage*360),alpha=focus<0||focus===i?1:.18;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#e2eaf4';ctx.fillText(String(i+1),p.x,p.y-14);ctx.restore();}
if(stage!==previousStage){previousStage=stage;$('stage').textContent=labels[stage];$('jump').value=stage;buttons.forEach((b,i)=>b.querySelector('.value').textContent=data[i].values[cols[stage]].toFixed(1)+'%')}
$('count').textContent=String(stage+1).padStart(2,'0')+' / 09';if(document.activeElement!==$('progress'))$('progress').value=pos;
}
function stop(){playing=false;$('play').textContent=pos>=8?'다시 출발':'출발'}function goto(t){stop();targetPos=Math.max(0,Math.min(8,t));if(reduced)pos=targetPos;wake()}$('play').onclick=()=>{if(playing){stop();return}if(pos>=7.999){pos=0;targetPos=0}playing=true;$('play').textContent='일시정지';wake()};$('previous').onclick=()=>goto(Math.ceil(pos)-1);$('next').onclick=()=>goto(Math.floor(pos)+1);$('jump').onchange=e=>goto(+e.target.value);$('progress').oninput=e=>goto(+e.target.value);canvas.addEventListener('wheel',e=>{e.preventDefault();goto(targetPos+e.deltaY*(e.deltaMode===1?16:1)*.0015)},{passive:false});let drag=null;canvas.onpointerdown=e=>{drag={y:e.clientY,p:pos};canvas.setPointerCapture(e.pointerId);stop()};canvas.onpointermove=e=>{if(drag)goto(drag.p+(drag.y-e.clientY)*.008)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,1.5);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);wake()}window.onresize=resize;document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();cancelAnimationFrame(animationFrame);animationFrame=0}else wake()});
function tick(now){animationFrame=0;let dt=Math.min(.05,(now-last)/1000);last=now;if(playing)targetPos=Math.min(8,targetPos+dt*.16);let diff=targetPos-pos;if(Math.abs(diff)>.00005){pos+=diff*(reduced?1:1-Math.exp(-dt*14));dirty=true}else if(pos!==targetPos){pos=targetPos;dirty=true}if(playing&&targetPos>=8&&pos>7.999){pos=8;stop();dirty=true}if(dirty){draw();dirty=false}if(playing||Math.abs(targetPos-pos)>.00005)animationFrame=requestAnimationFrame(tick)}resize();
</script></html>
